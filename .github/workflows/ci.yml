name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 20 }
          - { os: ubuntu-latest, node: 24 }
          - { os: windows-latest, node: 24 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            servers/node/package-lock.json
      - name: Install (both lockfiles)
        run: |
          npm ci
          npm run server:install
      - name: Runtime dependency audit
        run: |
          npm audit --omit=dev
          npm audit --omit=dev --prefix servers/node
      - name: Verify (identity, secrets, tests, builds, server lint/tests, bundle)
        run: npm run verify
      - name: Assemble release candidate and smoke-test the server
        run: npm run release:assemble
      - name: Upload release manifest
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: release/*/release-manifest.json
